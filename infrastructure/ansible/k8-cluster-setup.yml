---
- name: Setup Kubernetes Cluster (Control + Workers)
  hosts: all
  become: yes

  vars:
    kube_version: "1.31"
    pod_network_cidr: "10.244.0.0/16"
    control_plane_ip: "10.0.1.77"

  tasks:
    - name: Remove old Kubernetes repo if exists
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Disable swap immediately
      command: swapoff -a

    - name: Disable swap permanently in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Create modules-load directory
      file:
        path: /etc/modules-load.d
        state: directory
        mode: 0755

    - name: Load kernel modules for Kubernetes
      copy:
        dest: /etc/modules-load.d/kubernetes.conf
        content: |
          overlay
          br_netfilter
        mode: 0644

    - name: Load modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Create sysctl directory
      file:
        path: /etc/sysctl.d
        state: directory
        mode: 0755

    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
        mode: 0644

    - name: Apply sysctl settings
      command: sysctl --system

    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
          - conntrack
          - socat
          - ebtables
          - ipset
        state: present
        update_cache: yes

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: 0755

    - name: Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: yes

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        allow_change_held_packages: yes

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Install containerd
      apt:
        name: containerd
        state: present

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: 0755

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart and enable containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

- name: Initialize control plane
  hosts: control
  become: yes
  vars:
    pod_network_cidr: "10.244.0.0/16"
    control_plane_ip: "10.0.1.77"
    
  tasks:
    - name: Check containerd status
      systemd:
        name: containerd
      register: containerd_status

    - name: Display containerd status
      debug:
        msg: "Containerd is {{ containerd_status.status.ActiveState }}"

    - name: Check kubelet status
      systemd:
        name: kubelet
      register: kubelet_status

    - name: Display kubelet status
      debug:
        msg: "Kubelet is {{ kubelet_status.status.ActiveState }}"

    - name: Verify containerd is using systemd cgroup
      shell: grep -i "SystemdCgroup = true" /etc/containerd/config.toml
      register: cgroup_check
      ignore_errors: yes

    - name: Display cgroup configuration
      debug:
        msg: "SystemdCgroup configuration: {{ 'CORRECT' if cgroup_check.rc == 0 else 'INCORRECT - needs fix' }}"

    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Reset kubeadm if partial initialization exists
      shell: kubeadm reset -f
      when: not k8s_initialized.stat.exists
      ignore_errors: yes

    - name: Initialize Kubernetes control plane
      shell: |
        kubeadm init \
          --apiserver-advertise-address={{ control_plane_ip }} \
          --pod-network-cidr={{ pod_network_cidr }} \
          --v=5
      when: not k8s_initialized.stat.exists
      register: kubeadm_init

    - name: Display kubeadm init output
      debug:
        var: kubeadm_init.stdout_lines
      when: kubeadm_init is defined and kubeadm_init.stdout_lines is defined

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: 0755

    - name: Copy admin.conf to root's kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: 0600
      when: not k8s_initialized.stat.exists or kubeadm_init.changed

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: 0755

    - name: Copy admin.conf to ubuntu's kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: 0600

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Wait for control plane to be ready
      shell: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_result
      until: kubectl_result.rc == 0
      retries: 10
      delay: 30

    - name: Apply Flannel CNI
      shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_result
      until: flannel_result.rc == 0
      retries: 3
      delay: 10

    - name: Wait for Flannel pods to be ready
      shell: kubectl wait --for=condition=ready pod -l app=flannel -n kube-flannel --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ignore_errors: yes

    - name: Generate join command
      shell: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Save join command to local file
      delegate_to: localhost
      become: no
      copy:
        content: "{{ join_cmd.stdout }}"
        dest: "./join-command.sh"
        mode: 0700

- name: Join worker nodes
  hosts: workers
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Copy join command to worker
      copy:
        src: ./join-command.sh
        dest: /tmp/join-command.sh
        mode: 0700
      when: not kubelet_conf.stat.exists

    - name: Join worker to cluster
      shell: bash /tmp/join-command.sh
      when: not kubelet_conf.stat.exists
      register: join_result

    - name: Remove join command file
      file:
        path: /tmp/join-command.sh
        state: absent

- name: Verify cluster setup
  hosts: control
  become: yes
  tasks:
    - name: Get cluster nodes
      shell: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_nodes

    - name: Display cluster status
      debug:
        var: cluster_nodes.stdout_lines

    - name: Get all pods status
      shell: kubectl get pods --all-namespaces
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: all_pods

    - name: Display pods status
      debug:
        var: all_pods.stdout_lines

    - name: Install local-path storage provisioner
      shell: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Set local-path as default storage class
      shell: kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Get storage classes
      shell: kubectl get storageclass
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: storage_classes

    - name: Display storage classes
      debug:
        var: storage_classes.stdout_lines